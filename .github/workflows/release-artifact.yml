# Checks the exact files of a website release before a person approves the deploy.
#
# Two modes:
#   - Real release (manual run): downloads a ZIP of the built site that was uploaded as an
#     artifact to THIS repository, verifies its full SHA-256, unpacks it safely and runs the
#     site and CV checks on exactly those files.
#   - Dry run (automatic when this workflow or the checks change, or manual with dry_run):
#     builds a ZIP from the fictional sample site and runs the same steps, plus a negative
#     test proving a wrong hash is rejected. This keeps the release path tested even when
#     no real release is waiting.
# The job never approves a release. A person reviews the report and decides (docs/release-evidence.md).
name: release-artifact

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run with the fictional sample site (ignores the inputs below)'
        type: boolean
        default: false
      artifact_run_id:
        description: 'Run ID that uploaded the website ZIP artifact in THIS repository'
        required: false
        type: string
      artifact_name:
        description: 'Artifact name containing a ZIP of the static site files'
        required: false
        default: website-release
        type: string
      expected_sha256:
        description: 'Full SHA-256 of the site ZIP inside the artifact (64 lowercase hex characters)'
        required: false
        type: string
      cv_path:
        description: 'Public CV path inside the unzipped website (relative path)'
        required: false
        default: cv/Alexandra_Badescu_CV.pdf
        type: string
  push:
    paths:
      - '.github/workflows/release-artifact.yml'
      - 'checks/**'
  pull_request:
    paths:
      - '.github/workflows/release-artifact.yml'
      - 'checks/**'

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install checks
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install -r requirements.txt

      - name: 'Dry run: package the fictional sample site as a release ZIP'
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          node examples/src/make-cvs.js
          mkdir release-input
          (cd examples/sample-site && zip -qr ../../release-input/website-release.zip .)
          echo "EXPECTED_SHA256=$(sha256sum release-input/website-release.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "CV_PATH=cv/sample-cv.pdf" >> "$GITHUB_ENV"

      - name: 'Dry run: a wrong hash must be rejected'
        if: env.DRY_RUN == 'true'
        run: |
          if printf '%s  %s\n' "$(printf '%064d' 0)" release-input/website-release.zip | sha256sum -c - ; then
            echo '::error::A wrong hash was accepted'; exit 1
          fi
          echo 'PASS: a wrong hash is rejected'

      - name: 'Real release: validate the inputs'
        if: env.DRY_RUN != 'true'
        env:
          RUN_ID: ${{ inputs.artifact_run_id }}
          HASH: ${{ inputs.expected_sha256 }}
          CV: ${{ inputs.cv_path }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::artifact_run_id must be a run number'; exit 1; }
          [[ "$HASH" =~ ^[a-f0-9]{64}$ ]] || { echo '::error::expected_sha256 must be a full lowercase SHA-256'; exit 1; }
          [[ "$CV" =~ ^[A-Za-z0-9._/-]+\.pdf$ ]] || { echo '::error::cv_path must be a relative path to a PDF'; exit 1; }
          echo "EXPECTED_SHA256=$HASH" >> "$GITHUB_ENV"
          echo "CV_PATH=$CV" >> "$GITHUB_ENV"

      - name: 'Real release: download the artifact from this repository'
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input

      - name: Verify the hash and unpack the site safely
        run: |
          set -euo pipefail
          test "$(find release-input -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          ZIP=$(find release-input -maxdepth 1 -type f -name '*.zip' -print -quit)
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ZIP" | sha256sum -c -
          python3 - "$ZIP" <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path('release-site').resolve()
          root.mkdir()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for item in archive.infolist():
                  destination = (root / item.filename).resolve()
                  if not destination.is_relative_to(root):
                      raise SystemExit('Unsafe ZIP path: ' + item.filename)
                  if (item.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit('Symlinks are not allowed in a release ZIP')
              archive.extractall(root)
          PY
          test -f release-site/index.html

      - name: Check the exact release files
        run: |
          set -euo pipefail
          node checks/site-checks.js release-site --report release-site-report.json
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          root = pathlib.Path('release-site').resolve()
          cv = (root / os.environ['CV_PATH']).resolve()
          if not cv.is_relative_to(root) or not cv.is_file() or cv.suffix.lower() != '.pdf':
              raise SystemExit('Invalid or missing public CV path')
          sys.exit(subprocess.run(['python3', '-B', 'checks/cv-checks.py', str(cv)]).returncode)
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-release-check-results
          path: release-site-report.json
          if-no-files-found: warn
